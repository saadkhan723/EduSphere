
{% extends "base.html" %}

{% block title %}{{ feature.title }} | EduSphere{% endblock %}

{% block content %}

<div class="container py-5">

    <div class="feature-page card p-4 p-md-5">

        <span class="dashboard-label mb-3">
            {{ feature.role }} Feature
        </span>

        <h1>{{ feature.title }}</h1>

        <p class="mt-3">{{ feature.description }}</p>

        <div class="mt-4">
            <span class="coming-soon">
                Feature implementation in progress
            </span>
        </div>

        <a href="/{{ feature.role|lower }}"
           class="btn btn-primary mt-4">
            Back to Dashboard
        </a>

    </div>

</div>

{% endblock %}
